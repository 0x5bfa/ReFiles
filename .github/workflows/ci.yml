name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'assets/**'
      - 'builds/**'
      - 'docs/**'
      - '*.md'
  pull_request:
    paths-ignore:
      - 'assets/**'
      - 'builds/**'
      - 'docs/**'
      - '*.md'

run-name: ${{ github.event_name == 'pull_request' && 'PR validation' || 'CI validation' }}

env:
  WORKING_DIR:       ${{ github.workspace }} # Default: 'D:\a\Files\Files'
  SOLUTION_PATH:    '${{ github.workspace }}\Files.slnx'
  APP_PROJECT_PATH: '${{ github.workspace }}\src\Files\Files.csproj'

jobs:

  build:
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
        platform: [x64, arm64]
    env:
      CONFIGURATION: ${{ matrix.configuration }}
      ARCHITECTURE: ${{ matrix.platform }}

    steps:

    - name: Checkout the repository
      uses: actions/checkout@v6
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3
    - name: Setup NuGet
      uses: NuGet/setup-nuget@v3
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        global-json-file: global.json

    - name: Restore
      shell: pwsh
      run: |
        msbuild $env:SOLUTION_PATH `
          -t:Restore -p:Platform=$env:ARCHITECTURE -p:Configuration=$env:CONFIGURATION -p:PublishReadyToRun=true -v:quiet

    - name: Build
      shell: pwsh
      run: |
        msbuild $env:APP_PROJECT_PATH `
          -t:Build -p:Configuration=$env:CONFIGURATION -p:Platform=$env:ARCHITECTURE -p:AppxBundle=Never -p:GenerateAppxPackageOnBuild=false -v:quiet

    - name: Build automated tests
      if: matrix.configuration == 'Debug' && matrix.platform == 'x64'
      shell: pwsh
      run: |
        $testProjects = @(
          'tests/Files.UnitTests/Files.UnitTests.csproj',
          'tests/Files.UITests/Files.UITests.csproj',
          'tests/Files.AxeTests/Files.AxeTests.csproj'
        )
        foreach ($testProject in $testProjects) {
          msbuild $testProject `
            -t:Build -p:Configuration=$env:CONFIGURATION -p:Platform=$env:ARCHITECTURE -p:UseSharedCompilation=false -m:1 -nr:false -v:quiet -clp:ErrorsOnly
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
        }

    - name: Run Files.Core tests
      if: matrix.configuration == 'Debug' && matrix.platform == 'x64'
      shell: pwsh
      run: dotnet test tests/Files.UnitTests/Files.UnitTests.csproj --configuration $env:CONFIGURATION --no-build --no-restore -p:Platform=$env:ARCHITECTURE --verbosity quiet

    - name: Install Windows App SDK runtime
      if: matrix.configuration == 'Debug' && matrix.platform == 'x64'
      shell: pwsh
      run: |
        $runtimeRoot = Get-ChildItem "$env:USERPROFILE\.nuget\packages\microsoft.windowsappsdk.runtime" -Directory | Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
        if ($null -eq $runtimeRoot) {
          throw 'The restored Microsoft.WindowsAppSDK runtime package was not found.'
        }

        Get-ChildItem (Join-Path $runtimeRoot.FullName 'tools\MSIX\win10-x64') -Filter '*.msix' | Sort-Object Name | ForEach-Object {
          try {
            Add-AppxPackage -Path $_.FullName -ForceApplicationShutdown
          }
          catch {
            if ($_.Exception.Message -notmatch '0x80073D06') {
              throw
            }
          }
        }

    - name: Run UI tests
      if: matrix.configuration == 'Debug' && matrix.platform == 'x64'
      shell: pwsh
      timeout-minutes: 3
      run: |
        dotnet run --project tests/Files.UITests/Files.UITests.csproj `
          --configuration $env:CONFIGURATION --no-build --no-restore -p:Platform=$env:ARCHITECTURE `
          -- --filter "FullyQualifiedName!~BrowsePerformanceTests"

    - name: Run browse performance tests
      if: matrix.configuration == 'Debug' && matrix.platform == 'x64'
      shell: pwsh
      timeout-minutes: 5
      env:
        FILES_PERF_RESULTS_DIR: ${{ runner.temp }}\refiles-performance
      run: |
        dotnet run --project tests/Files.UITests/Files.UITests.csproj `
          --configuration $env:CONFIGURATION --no-build --no-restore -p:Platform=$env:ARCHITECTURE `
          -- --filter "TestCategory=Performance"

    - name: Upload browse performance results
      if: always() && matrix.configuration == 'Debug' && matrix.platform == 'x64'
      uses: actions/upload-artifact@v6
      with:
        name: browse-performance-${{ github.sha }}
        path: ${{ runner.temp }}\refiles-performance\*.json
        if-no-files-found: warn
        retention-days: 14

    - name: Register UI test application
      if: matrix.configuration == 'Debug' && matrix.platform == 'x64'
      shell: pwsh
      run: |
        $developerModePath = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock'
        New-Item -Path $developerModePath -Force | Out-Null
        Set-ItemProperty -Path $developerModePath -Name AllowDevelopmentWithoutDevLicense -Type DWord -Value 1

        $appManifest = Get-ChildItem "$env:WORKING_DIR\src\Files\bin\x64\Debug" -Filter AppxManifest.xml -Recurse | Where-Object { Test-Path (Join-Path $_.DirectoryName 'Files.exe') } | Sort-Object LastWriteTime -Descending | Select-Object -First 1
        if ($null -eq $appManifest) {
          throw 'The Files AppX manifest was not produced by the build.'
        }

        Add-AppxPackage -Register $appManifest.FullName -ForceApplicationShutdown
        $filesPackage = Get-AppxPackage -Name FilesDev | Select-Object -First 1
        if ($null -eq $filesPackage) {
          throw 'The FilesDev package was not registered.'
        }

        "FILES_AXE_TEST_APP_ID=$($filesPackage.PackageFamilyName)!App" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Run navigation UI tests
      if: matrix.configuration == 'Debug' && matrix.platform == 'x64'
      shell: pwsh
      env:
        FILES_NAVIGATION_STRESS_ITERATIONS: 100
      run: dotnet test tests/Files.AxeTests/Files.AxeTests.csproj --configuration $env:CONFIGURATION --no-build --no-restore -p:Platform=$env:ARCHITECTURE --verbosity normal
