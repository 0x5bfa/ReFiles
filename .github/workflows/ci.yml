name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'assets/**'
      - 'builds/**'
      - 'docs/**'
      - '*.md'
  pull_request:
    paths-ignore:
      - 'assets/**'
      - 'builds/**'
      - 'docs/**'
      - '*.md'

run-name: ${{ github.event_name == 'pull_request' && 'PR validation' || 'CI validation' }}

env:
  WORKING_DIR:       ${{ github.workspace }} # Default: 'D:\a\Files\Files'
  APP_PROJECT_PATH: '${{ github.workspace }}\src\Files\Files.csproj'

jobs:

  build:
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
        platform: [x64, arm64]
    env:
      CONFIGURATION: ${{ matrix.configuration }}
      ARCHITECTURE: ${{ matrix.platform }}

    steps:

    - name: Checkout the repository
      uses: actions/checkout@v6
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3
    - name: Setup NuGet
      uses: NuGet/setup-nuget@v3
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        global-json-file: global.json

    - name: Build application with restore
      shell: pwsh
      run: |
        msbuild $env:APP_PROJECT_PATH `
          -restore -t:Build -p:Configuration=$env:CONFIGURATION -p:Platform=$env:ARCHITECTURE -p:AppxBundle=Never -p:GenerateAppxPackageOnBuild=false -p:CsWinRTAotWarningLevel=1 -v:quiet

    - name: Build tests with restore
      if: matrix.configuration == 'Debug' && matrix.platform == 'x64'
      shell: pwsh
      run: |
        $testProjects = @(
          'tests/Files.UnitTests/Files.UnitTests.csproj',
          'tests/Files.UITests/Files.UITests.csproj',
          'tests/Files.AxeTests/Files.AxeTests.csproj'
        )
        foreach ($testProject in $testProjects) {
          msbuild $testProject `
            -restore -t:Build -p:Configuration=$env:CONFIGURATION -p:Platform=$env:ARCHITECTURE -p:UseSharedCompilation=false -m:1 -nr:false -v:quiet -clp:ErrorsOnly
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
        }

    - name: Run unit tests
      if: matrix.configuration == 'Debug' && matrix.platform == 'x64'
      shell: pwsh
      run: dotnet test tests/Files.UnitTests/Files.UnitTests.csproj --configuration Debug --no-build --no-restore -p:Platform=x64 --verbosity quiet

    - name: Install Windows App SDK runtime
      if: matrix.configuration == 'Debug' && matrix.platform == 'x64'
      shell: pwsh
      run: |
        $runtimeRoot = Get-ChildItem "$env:USERPROFILE\.nuget\packages\microsoft.windowsappsdk.runtime" -Directory | Sort-Object LastWriteTime -Descending | Select-Object -First 1
        if ($null -eq $runtimeRoot) {
          throw 'The restored Microsoft.WindowsAppSDK runtime package was not found.'
        }

        Get-ChildItem (Join-Path $runtimeRoot.FullName 'tools\MSIX\win10-x64') -Filter '*.msix' | Sort-Object Name | ForEach-Object {
          try {
            Add-AppxPackage -Path $_.FullName -ForceApplicationShutdown
          }
          catch {
            if ($_.Exception.Message -notmatch '0x80073D06') {
              throw
            }
          }
        }

    - name: Run UI tests
      if: matrix.configuration == 'Debug' && matrix.platform == 'x64'
      shell: pwsh
      timeout-minutes: 15
      run: dotnet test tests/Files.UITests/Files.UITests.csproj --configuration Debug --no-build --no-restore -p:Platform=x64 --verbosity normal

    - name: Register UI test application
      if: matrix.configuration == 'Debug' && matrix.platform == 'x64'
      shell: pwsh
      run: |
        $developerModePath = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock'
        New-Item -Path $developerModePath -Force | Out-Null
        Set-ItemProperty -Path $developerModePath -Name AllowDevelopmentWithoutDevLicense -Type DWord -Value 1

        $appManifest = Get-ChildItem "$env:WORKING_DIR\src\Files\bin\x64\Debug" -Filter AppxManifest.xml -Recurse | Where-Object { Test-Path (Join-Path $_.DirectoryName 'Files.exe') } | Sort-Object LastWriteTime -Descending | Select-Object -First 1
        if ($null -eq $appManifest) {
          throw 'The Files AppX manifest was not produced by the build.'
        }

        Add-AppxPackage -Register $appManifest.FullName -ForceApplicationShutdown
        [xml] $manifest = Get-Content $appManifest.FullName -Raw
        $package = Get-AppxPackage -Name $manifest.Package.Identity.Name | Sort-Object Version -Descending | Select-Object -First 1
        if ($null -eq $package) {
          throw "The registered package '$($manifest.Package.Identity.Name)' was not found."
        }

        $applicationId = $manifest.Package.Applications.Application.Id
        "FILES_AXE_TEST_APP_ID=$($package.PackageFamilyName)!$applicationId" >> $env:GITHUB_ENV

    - name: Run Axe tests
      if: matrix.configuration == 'Debug' && matrix.platform == 'x64'
      shell: pwsh
      run: dotnet test tests/Files.AxeTests/Files.AxeTests.csproj --configuration Debug --no-build --no-restore -p:Platform=x64 --verbosity normal
