name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'assets/**'
      - 'builds/**'
      - 'docs/**'
      - '*.md'
  pull_request:
    paths-ignore:
      - 'assets/**'
      - 'builds/**'
      - 'docs/**'
      - '*.md'

run-name: ${{ github.event_name == 'pull_request' && 'PR validation' || 'CI validation' }}

env:
  WORKING_DIR:       ${{ github.workspace }} # Default: 'D:\a\Files\Files'
  APP_PROJECT_PATH: '${{ github.workspace }}\src\Files\Files.csproj'
  OPERATIONS_PROJECT_PATH: '${{ github.workspace }}\src\Files.BackgroundServer\Files.BackgroundServer.csproj'

jobs:

  build:
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
        platform: [x64, arm64]
    env:
      CONFIGURATION: ${{ matrix.configuration }}
      ARCHITECTURE: ${{ matrix.platform }}

    steps:

    - name: Checkout the repository
      uses: actions/checkout@v6
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3
    - name: Setup NuGet
      uses: NuGet/setup-nuget@v3
    - name: Verify .NET SDK
      shell: pwsh
      run: |
        dotnet --version
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        dotnet --info

    - name: Build app
      shell: pwsh
      run: |
        msbuild $env:APP_PROJECT_PATH `
          -restore -t:Build -p:Configuration=$env:CONFIGURATION -p:Platform=$env:ARCHITECTURE -p:AppxBundle=Never -p:GenerateAppxPackageOnBuild=false -p:CsWinRTAotWarningLevel=3 -v:quiet

    - name: Build operations server
      shell: pwsh
      run: |
        msbuild $env:OPERATIONS_PROJECT_PATH `
          -restore -t:Build -p:Configuration=$env:CONFIGURATION -p:Platform=$env:ARCHITECTURE -v:quiet -clp:ErrorsOnly

    - name: Validate packages and external consumers
      if: matrix.configuration == 'Release' && matrix.platform == 'x64'
      shell: pwsh
      run: ./scripts/Validate-Packages.ps1 -Configuration Release -Platform x64

    - name: Verify deterministic NuGet packages
      if: matrix.configuration == 'Release' && matrix.platform == 'x64'
      shell: pwsh
      run: |
        $timestamp = git show -s --format=%ct HEAD
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        $projects = @('Files.Core.Contracts', 'Files.Core.ProviderContracts', 'Files.Core', 'Files.Providers', 'Files.Hosting')
        $firstOutput = Join-Path $env:RUNNER_TEMP 'ReFiles-pack-a'
        $secondOutput = Join-Path $env:RUNNER_TEMP 'ReFiles-pack-b'
        $outputDirectories = @($firstOutput, $secondOutput)
        foreach ($outputDirectory in $outputDirectories) {
          New-Item -ItemType Directory -Force -Path $outputDirectory | Out-Null
          foreach ($project in $projects) {
            $packArguments = @(
              'pack',
              "src/$project/$project.csproj",
              '--configuration', 'Release',
              '--no-build',
              '--no-restore',
              '-p:Platform=x64',
              '-p:PackageVersion=0.0.0-ci',
              '-p:ContinuousIntegrationBuild=true',
              "-p:DeterministicTimestamp=$timestamp",
              "-p:RepositoryCommit=$env:GITHUB_SHA",
              '--output', $outputDirectory,
              '--verbosity', 'quiet'
            )
            & dotnet @packArguments
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
        }

        $firstPackages = @(Get-ChildItem -LiteralPath $firstOutput -File | Sort-Object Name)
        $secondPackages = @(Get-ChildItem -LiteralPath $secondOutput -File | Sort-Object Name)
        if ($firstPackages.Count -eq 0 -or ($firstPackages.Name -join "`n") -ne ($secondPackages.Name -join "`n")) {
          throw 'The deterministic package runs produced different package files.'
        }

        foreach ($package in $firstPackages) {
          $firstHash = (Get-FileHash -LiteralPath $package.FullName -Algorithm SHA256).Hash
          $secondHash = (Get-FileHash -LiteralPath (Join-Path $secondOutput $package.Name) -Algorithm SHA256).Hash
          if ($firstHash -ne $secondHash) {
            throw "Deterministic package check failed for $($package.Name)."
          }
        }

    - name: Validate Native AOT MSIX payload
      if: matrix.configuration == 'Release'
      shell: pwsh
      run: ./scripts/Validate-AppPackage.ps1 -Platform $env:ARCHITECTURE

    - name: Build tests
      if: matrix.configuration == 'Debug' && matrix.platform == 'x64'
      shell: pwsh
      run: |
        $testProjects = @(
          'tests/Files.IntegrationTests/Files.IntegrationTests.csproj',
          'tests/Files.UnitTests/Files.UnitTests.csproj',
          'tests/Files.UITests/Files.UITests.csproj',
          'tests/Files.AxeTests/Files.AxeTests.csproj'
        )
        foreach ($testProject in $testProjects) {
          msbuild $testProject `
            -restore -t:Build -p:Configuration=$env:CONFIGURATION -p:Platform=$env:ARCHITECTURE -p:UseSharedCompilation=false -m:1 -nr:false -v:quiet -clp:ErrorsOnly
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
        }

    - name: Verify C# formatting and style
      if: matrix.configuration == 'Debug' && matrix.platform == 'x64'
      shell: pwsh
      env:
        Platform: x64
      run: |
        dotnet format Files.slnx --verify-no-changes --severity error `
          --diagnostics IDE1006 IDE0011 SA1201 SA1202 SA1203 SA1507 SA1513 SA1611 SA1615 SA1618 `
          --verbosity minimal

    - name: Run unit tests
      if: matrix.configuration == 'Debug' && matrix.platform == 'x64'
      shell: pwsh
      run: dotnet test tests/Files.UnitTests/Files.UnitTests.csproj --configuration Debug --no-build --no-restore -p:Platform=x64 --verbosity quiet

    - name: Setup Python for FTP integration tests
      if: matrix.configuration == 'Debug' && matrix.platform == 'x64'
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'

    - name: Install pyftpdlib
      if: matrix.configuration == 'Debug' && matrix.platform == 'x64'
      shell: pwsh
      run: python -m pip install --disable-pip-version-check pyftpdlib==2.1.0

    - name: Run FTP integration tests
      if: matrix.configuration == 'Debug' && matrix.platform == 'x64'
      shell: pwsh
      timeout-minutes: 10
      run: dotnet test tests/Files.IntegrationTests/Files.IntegrationTests.csproj --configuration Debug --no-build --no-restore -p:Platform=x64 --verbosity normal

    - name: Install Windows App SDK runtime
      if: matrix.configuration == 'Debug' && matrix.platform == 'x64'
      shell: pwsh
      run: |
        $runtimeRoot = Get-ChildItem "$env:USERPROFILE\.nuget\packages\microsoft.windowsappsdk.runtime" -Directory | Sort-Object LastWriteTime -Descending | Select-Object -First 1
        if ($null -eq $runtimeRoot) {
          throw 'The restored Microsoft.WindowsAppSDK runtime package was not found.'
        }

        Get-ChildItem (Join-Path $runtimeRoot.FullName 'tools\MSIX\win10-x64') -Filter '*.msix' | Sort-Object Name | ForEach-Object {
          try {
            Add-AppxPackage -Path $_.FullName -ForceApplicationShutdown
          }
          catch {
            if ($_.Exception.Message -notmatch '0x80073D06') {
              throw
            }
          }
        }

    - name: Run UI tests
      if: matrix.configuration == 'Debug' && matrix.platform == 'x64'
      shell: pwsh
      timeout-minutes: 15
      run: dotnet test tests/Files.UITests/Files.UITests.csproj --configuration Debug --no-build --no-restore -p:Platform=x64 --verbosity normal

    - name: Register UI test application
      if: matrix.configuration == 'Debug' && matrix.platform == 'x64'
      shell: pwsh
      run: |
        $developerModePath = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock'
        New-Item -Path $developerModePath -Force | Out-Null
        Set-ItemProperty -Path $developerModePath -Name AllowDevelopmentWithoutDevLicense -Type DWord -Value 1

        $appManifest = Get-ChildItem "$env:WORKING_DIR\src\Files\bin\x64\Debug" -Filter AppxManifest.xml -Recurse | Where-Object { Test-Path (Join-Path $_.DirectoryName 'Files.exe') } | Sort-Object LastWriteTime -Descending | Select-Object -First 1
        if ($null -eq $appManifest) {
          throw 'The Files AppX manifest was not produced by the build.'
        }

        Add-AppxPackage -Register $appManifest.FullName -ForceApplicationShutdown
        [xml] $manifest = Get-Content $appManifest.FullName -Raw
        $package = Get-AppxPackage -Name $manifest.Package.Identity.Name | Sort-Object Version -Descending | Select-Object -First 1
        if ($null -eq $package) {
          throw "The registered package '$($manifest.Package.Identity.Name)' was not found."
        }

        $applicationId = $manifest.Package.Applications.Application.Id
        "FILES_AXE_TEST_APP_ID=$($package.PackageFamilyName)!$applicationId" >> $env:GITHUB_ENV

    - name: Run Axe tests
      if: matrix.configuration == 'Debug' && matrix.platform == 'x64'
      shell: pwsh
      run: dotnet test tests/Files.AxeTests/Files.AxeTests.csproj --configuration Debug --no-build --no-restore -p:Platform=x64 --verbosity normal
